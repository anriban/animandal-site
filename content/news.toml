text = "Three papers accepted at **WORKS '26**, the 21st Workshop on Workflows in Support of Large-Scale Science at SC'26 in Chicago, covering AI-assisted workflow management, decentralized scheduling, and LLM gating for multi-agent HPC scheduling."

