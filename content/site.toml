# Site-wide settings and your profile.
#
# Text fields accept a little Markdown: [link text](https://...), **bold**, *italic*.

[site]
title = "Anirban Mandal"
description = "Anirban Mandal, Ph.D. — Director, Network Research & Infrastructure Group (NRIG), RENCI, UNC Chapel Hill. Research in distributed systems, cloud computing, networking and scientific workflows."
url = "https://www.animandal.com"        # used for canonical links / social previews
# Name variants that get bolded in publication author lists
highlight_author = ["A. Mandal", "Anirban Mandal", "Mandal, A.", "Mandal A"]
# How many items to show on the home page
home_news_count = 6
home_projects_count = 6
# Google Analytics 4 measurement ID (Admin → Data streams). Remove the line to turn analytics off.
google_analytics = "G-G3NLKEJV49"

[profile]
name = "Anirban Mandal"
honorific = "Ph.D."
role = "Director, Network Research & Infrastructure Group (NRIG)"
organization = "Renaissance Computing Institute (RENCI), University of North Carolina at Chapel Hill"
# Put your photo at assets/images/profile.jpg (square, ~600x600 works best).
# If the file is missing, the site shows your initials instead.
photo = "assets/images/profile.jpg"
email = "anirban@renci.org"
# The PDF made by cv.py. Run `python3 cv.py` to refresh it, then commit cv/Anirban_Mandal_CV.pdf.
# Old Google Drive copy: https://drive.google.com/file/d/1XHfx2hOhocCa7zygwPSm2ZpaudF4U0nO/view?usp=sharing
cv_url = "cv/Anirban_Mandal_CV.pdf"
cv_label = "CV"

# Paragraphs of the "About" section on the home page
bio = [
  "I serve as the Director for the [Network Research and Infrastructure Group (NRIG)](http://nrig.renci.org) at the [Renaissance Computing Institute (RENCI)](https://renci.org) at the [University of North Carolina at Chapel Hill](https://www.unc.edu). I am a computer systems researcher whose work sits at the intersection of distributed systems and scientific computing. At RENCI, I lead several efforts in cyberinfrastructure research in support of science.",
  "My research interests lie in distributed systems, cloud computing, networking, and data-driven scientific workflows. I have wide-ranging expertise in resource provisioning, scheduling, performance analysis, machine learning, and anomaly detection for large-scale scientific cyberinfrastructure, next-generation networks, and experimental testbeds. I also serve as the Associate Director for [CI Compass](https://ci-compass.org/), the NSF Cyberinfrastructure Center of Excellence serving NSF Major and Mid-scale Facilities.",
]

interests = [
  "Distributed systems",
  "Cloud & edge computing",
  "Networking & testbeds",
  "Scientific workflows",
  "Resource provisioning & scheduling",
  "Performance analysis",
  "ML for anomaly detection",
  "Cyberinfrastructure",
  "Quantum networking",
]

