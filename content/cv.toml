# CV-only content. Everything else in the CV (profile, publications, grants, honors,
# service, projects) comes from the other files in content/, so the website and the CV
# never drift apart. Rebuild the PDF with:  python3 cv.py
#
# Text fields accept the same small Markdown as the website: [link](url), **bold**, *italic*.

[cv]
# Shown under your name at the top of the CV
headline = "Director, Network Research & Infrastructure Group (NRIG), RENCI · Associate Director, CI Compass"
# Two to four sentences. Keep it about impact and focus, not a list of keywords.
summary = "Computer systems researcher working at the intersection of distributed systems and scientific computing. I lead federally funded, multi-institutional research on AI-enabled scientific workflows, edge-to-cloud computing, network testbeds, performance and anomaly analysis, and cyberinfrastructure (CI) for NSF Major Facilities. My work has been supported by NSF and DOE awards with combined budgets of more than $40M, and has produced more than 100 publications, including five best paper awards."
# Output file name (written to cv/)
filename = "Anirban_Mandal_CV.pdf"
# Publication groups, in order. Each publication's `type` decides its group.
publication_groups = [
  { title = "Journal Articles", types = ["journal"] },
  { title = "Conference Papers", types = ["conference"] },
  { title = "Workshop Papers", types = ["workshop"] },
  { title = "Book Chapters", types = ["chapter"] },
  { title = "Reports, Preprints, Posters, and Theses", types = ["report", "preprint", "poster", "thesis"] },
]

