website = "https://sites.google.com/view/poseidon-workflows/home"
summary = "Advances how simulation and machine learning can be harnessed to improve DOE's computational and data science. PosEiDon provides an integrated platform that helps facility operators and scientists improve end-to-end science workflows by (1) predicting the performance of complex workflows; (2) detecting and classifying infrastructure and workflow anomalies and explaining their sources; and (3) suggesting performance optimizations."
