[[project]]
name = "PegasusAI"
title = "CSSI: Frameworks: Applying Artificial Intelligence Advances to the Next Generation of Workflow Management on Modern Cyberinfrastructure"
status = "current"
role = "Co-Principal Investigator"
funder = "National Science Foundation"
award = "2513101"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2513101"
years = "2025–2030"
website = "https://pegasusai.io/"
overview = "https://renci.org/news/universities-unite-to-advance-ai-driven-workflow-management-on-modern-cyberinfrastructure/"
summary = "Applies new advances in AI to build an open, modular workflow management framework (iWMS) that brings AI to the entire workflow lifecycle across the computing continuum: automated workflow composition, intelligent resource provisioning, performance prediction, real-time anomaly detection, and workflow adaptation. Retrieval-augmented generation supports workflow discovery and assembly, and ML-based planning and monitoring optimize execution and reliability. The project is led by USC/ISI with RENCI, the University of Tennessee, Knoxville, and UMass Amherst, and builds on the Pegasus Workflow Management System."
tags = ["AI for workflows", "Pegasus", "Computing continuum"]

[[project]]
name = "CI Compass"
title = "CI CoE: CI Compass: An NSF CI Center of Excellence for Navigating the Major Facilities Data Lifecycle"
status = "current"
role = "Co-Principal Investigator"
funder = "National Science Foundation"
award = "2127548"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2127548"
years = "2021–2026"
website = "https://ci-compass.org/"
overview = "https://ci-compass.org/about/"
summary = "Provides expertise and active support to cyberinfrastructure practitioners at [NSF Major Facilities](https://ci-compass.org/about/nsf-major-facilities/) to accelerate the data lifecycle and ensure the integrity and effectiveness of the cyberinfrastructure upon which research and discovery depend. The vision is to be the leader in supporting and enhancing the national CI ecosystem — people, practical knowledge, and processes — to facilitate knowledge sharing and discovery across NSF's Major Facilities."
tags = ["Cyberinfrastructure", "Data lifecycle", "Center of Excellence"]

[[project]]
name = "SWARM"
title = "Scientific Workflow Applications on Resilient Metasystem"
status = "current"
role = "Co-Principal Investigator"
funder = "Department of Energy"
award = "DE-SC0024351"
years = "2023–2028"
website = "https://swarm-workflows.org/"
summary = "Explores how distributed intelligence — specifically swarm intelligence — can provide robust, performant, resilient, and fault-tolerant execution of DOE scientific workflows spanning a continuum of resources, from edge devices near sensors and instruments, through wide-area networks, to leadership-class systems. The goal is an SI-based resilient Integrated Research Infrastructure (IRI) that recovers quickly from failures, adapts to change, maximizes resource utilization, and optimizes workflow execution time."
tags = ["Swarm intelligence", "Resilience", "Workflows"]

[[project]]
name = "CITEAM"
title = "Cyberinfrastructure Training and Education for Leveraging Advanced Electron Microscopy in Materials Science"
status = "current"
role = "Principal Investigator"
funder = "National Science Foundation"
award = "2519465"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2519465"
years = "2025–2028"
website = "https://citeamcourse.org/"
summary = "Develops a cyberinfrastructure training program for materials scientists who rely on advanced microscopes such as transmission electron microscopes (TEM) and need to process and manage large data volumes. The program is anchored on a new aberration-corrected TEM/STEM at the University of Maryland. Topics include TEM instrument software, image analysis, scientific computing, AI for TEM image and data analysis, diffraction and spectroscopy data analysis, distributed computing for microscope data, and data curation and FAIR. A \"train the trainers\" element prepares research facilitators and lab staff scientists to guide others."
tags = ["Training", "Electron microscopy", "Materials science"]

[[project]]
name = "REU Site: FABRIC"
title = "REU Site: Exploring the FABRIC Research Instrument to Catalyze Multi-disciplinary Research in Networks, Distributed Systems, and Emerging CI Applications"
status = "current"
role = "Principal Investigator"
funder = "National Science Foundation"
award = "2447441"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2447441"
years = "2025–2028"
website = "https://reusite.renci.org/"
overview = "https://renci.org/blog/renci-hosts-inaugural-reu-site/"
summary = "A summer Research Experiences for Undergraduates program hosted at RENCI that uses the NSF [FABRIC](https://fabric-testbed.net/) testbed to give students immersive, hands-on research in networking, distributed systems, cybersecurity, and AI applications. A core curriculum in networking, programming, systems, and cyberinfrastructure leads into a mentored research phase on topics such as federated learning, in-band network telemetry, P4/FPGA network security, and congestion control. The program aims to broaden participation, including students from less-resourced institutions."
tags = ["Undergraduate research", "FABRIC", "Workforce"]

[[project]]
name = "ORION"
title = "Collaborative Research: Cross-Cutting Improvements: Open Science Roadmap for Research Infrastructures"
status = "current"
role = "Principal Investigator (UNC)"
funder = "National Science Foundation"
award = "2531701"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2531701"
years = "2025–2028"
summary = "Studies data management practices at selected NSF Major and mid-scale facilities to create a roadmap, aligned with the FAIR principles, that facilities can use to improve how research data is organized, stored, and shared. Surveys of facility personnel and users cover data provenance, transfer, packaging, storage, enrichment, and deposit for dissemination and citation. The roadmap will be refined through community workshops and evaluated with hands-on pilots at the surveyed facilities. Collaborators are the University of Notre Dame (lead), USC/ISI, RENCI, and Indiana University."
tags = ["Open science", "FAIR data", "Research infrastructure"]

[[project]]
name = "FlyNet"
title = "An 'On-the-fly' Deeply Programmable End-to-end Network-Centric Platform for Edge-to-Core Workflows"
status = "current"
role = "Co-Principal Investigator"
funder = "National Science Foundation"
award = "2018074"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2018074"
years = "2020–2022"
website = "http://flynet-ci.org/"
overview = "https://dl.acm.org/doi/10.1145/3468737.3494098"
summary = "Provides an architecture and tools that let scientists include edge computing devices in their computational workflows — critical for low-latency applications like drone video analytics and drone route planning. FlyNet integrates cutting-edge network and compute infrastructure with in-network processing through new programming abstractions, leveraging the Pegasus Workflow Management System."
tags = ["Edge computing", "Drones", "Programmable networks"]

[[project]]
name = "X-CITE"
title = "CyberInfrastructure Training and Education for Synchrotron X-Ray Science"
status = "previous"
role = "Principal Investigator"
funder = "National Science Foundation"
award = "2320373"
award_url = "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2320373"
years = "2023–2026"
website = "https://sites.google.com/view/x-cite-nsf/home"
summary = "Develops an innovative cyberinfrastructure training program for scientists using the CHESS synchrotron X-ray facility, who conduct research in materials science, physics, chemistry, biology, environmental science and more. Training spans five themes — programming essentials, systems fundamentals, distributed computing with the CI ecosystem, X-ray science software, and data curation and FAIR — delivered through self-paced notebooks, videos, CI catalogs, office hours, in-person sessions, CHESS user workshops, and tutorials at domain conferences."
tags = ["Training", "X-ray science", "CHESS"]

[[project]]
