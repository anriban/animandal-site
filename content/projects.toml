summary = "A networked cloud testbed linking [GENI](http://www.geni.net) to open cloud computing (OpenStack) and dynamic circuit fabrics. ExoGENI orchestrates a federation of independent cloud sites across the US and circuit providers such as Internet2 and ESnet through their native IaaS APIs — in effect a widely distributed networked infrastructure-as-a-service (NIaaS) platform for experimentation and computation."
